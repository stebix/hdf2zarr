[project]
name = "hdf2zarr"
version = "0.1.0"
description = "Quick python utility to convert HDF5 files to Zarr format"
readme = "README.md"
authors = [
    { name = "stebix", email = "jannik.stebani@physik.uni-wuerzburg.de" }
]
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.10",
    "zarr>=3.0,<4",
    "click>=8.1",
    "rich>=13.0",
    "structlog>=24.1",
    "numcodecs>=0.13",
]

[project.scripts]
hdf2zarr = "hdf2zarr:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=2.0",
    "ruff>=0.8",
    "pyright>=1.1",
]
